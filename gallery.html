<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Gallery</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">
</head>

<body>
   
    <main>
        <section class="gallery-section" style="min-height: 100vh; display: flex; align-items: center;">
            <div class="gallery-grid">
                <div class="grid-col-1">
                    <div class="gallery-item">
                        <img src="images/pexels-rachel-claire-6752433.jpg" alt="Food Table">

                    </div>
                    <div class="gallery-item">
                        <img src="images/pexels-eva-bronzini-6141651.jpg" alt="Delicious Burger">

                    </div>
                </div>
                <div class="grid-col-2">
                    <div class="gallery-item tall-item">
                        <img src="images/pexels-mister-mister-3434523.jpg" alt="Neon Sign">

                    </div>
                </div>
                <div class="grid-col-3">
                    <div class="info-box">
                        <span class="subtitle">LOREM IPSUM</span>
                        <h2>LOREM IPSUM SET ADEMIR</h2>
                        <a href="index.html" style="text-decoration: none; color: inherit;">
                            <div class="click-action">
                                <span>Click</span>
                                <img src="images/icons8-arrow-30.png" alt="Arrow">
                            </div>
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </main>

</body>

</html>
